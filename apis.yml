name: IDEXX
kind: company
description: IDEXX Laboratories is a global leader in veterinary diagnostics, offering
  reference laboratory testing, in-house analyzers (IDEXX VetLab Station), diagnostic
  imaging (IDEXX Web PACS), and practice management software (Cornerstone, Neo, and
  ezyVet, which IDEXX acquired in 2021). IDEXX connects the practice to its diagnostic
  ecosystem through VetConnect PLUS - a diagnostic results and ordering platform - and
  through partner integration APIs for Web PACS imaging and reference/in-house lab
  results. These developer integrations are partner-gated - the developer portal at
  developer.vetconnectplus.com requires an authenticated login, and partner access is
  granted only after an approved IDEXX integration request. Web PACS API Partner
  integrations authenticate with OAuth 2.0-style credentials (Client ID, Client Secret,
  and Grant Type) issued by IDEXX customer support. IDEXX does not publish an open,
  unauthenticated API reference, OpenAPI description, or pricing; the logical APIs below
  are modeled from IDEXX's public product and integration pages, not from a public
  endpoint reference.
