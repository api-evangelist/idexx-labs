  - url: https://software.idexx.com/integrations
    type: Documentation
    note: IDEXX Software integrations directory (200+ integrations across ezyVet/Neo/Cornerstone).
  - url: https://www.idexx.com/en/veterinary/software-services/idexx-practice-management-software-integration-request-form/
    type: Documentation
    note: Integration request form - the gated entry point to becoming an IDEXX integration partner.
  - url: https://docs.ezyvet.com/en/see-all-integrations/diagnostic-imaging/idexx-web-pacs/configuration-of-idexx-web-pacs/configure-the-api-integration-for-idexx-web-pacs
    type: Documentation
    note: ezyVet config guide - Web PACS "API Partner" integration uses Client ID / Client Secret / Grant Type from IDEXX.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No public WebSocket surface exists, and IDEXX's own developer/partner
    integrations are request/response HTTP behind an authenticated, partner-gated
    developer portal. No AsyncAPI document was created because there is no
    documented server-push transport on IDEXX's public surface to model, and no
    OpenAPI/plans/rate-limits/finops files were authored because IDEXX publishes
    no open endpoint reference or pricing - the entry is an honest partner-gated
    stub with logical APIs modeled from public product pages.
